[package]
name = "comfe-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
nalgebra = "0.32.0"
konst = "*"

[dev-dependencies]
# rand 0.8 matches the rand integration of nalgebra 0.32 (random matrices and rotations)
rand = "0.8.5"
nalgebra = { version = "0.32.0", features = ["rand"] }


[lib]
name = "comfe"
crate-type = ["cdylib", "rlib"]
